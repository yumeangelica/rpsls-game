<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>RPSLS Game - Rock Paper Scissors Lizard Spock</title>
  <meta name="description" content="Play Rock Paper Scissors Lizard Spock against the computer in this modern web game">
  <meta name="theme-color" content="#b24d89">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
  <script src="./copyright.js" defer></script>
</head>

<body>
  <main>
    <h1>Rock, Paper, Scissors,<br>Lizard, Spock</h1>
    <p class="subtitle">vs Computer</p>

    <nav class="navigation-links" aria-label="External links">
      <a href="https://github.com/yumeangelica/rpsls-game" class="external-link" target="_blank"
        rel="noopener noreferrer" aria-label="View source code on GitHub (opens in new tab)">Source Code</a>
      <a href="https://yumeangelica.github.io" class="external-link" target="_blank" rel="noopener noreferrer"
        aria-label="Visit portfolio website (opens in new tab)">My Portfolio</a>
    </nav>

    <!-- Game control buttons -->
    <div class="control-buttons">
      <button class="btn-action rules-toggle-btn" type="button" aria-expanded="false" aria-controls="gameRules">
        📋 Show Game Rules
      </button>
      <button class="btn-action reset-btn" id="resetGameBtn">🔄 Reset Game</button>
    </div>

    <!-- Game rules (toggled) -->
    <div class="collapse" id="gameRules">
      <div class="game-rules-container">
        <h2>How to Play</h2>
        <div class="rules-grid"></div>
      </div>
    </div>

    <!-- Main game area -->
    <div class="main-game-container">
      <div class="game-statistics-section"></div>
      <!-- Game area generated dynamically by JS -->
    </div>
  </main>

  <footer id="page-footer" aria-label="Copyright information"></footer>
</body>

</html>
